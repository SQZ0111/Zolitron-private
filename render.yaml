databases:
  - name: zolitron-db
    databaseName: zolitron
    user: zolitron
    plan: free

services:
  - type: web
    name: zolitron-backend
    env: python
    plan: free
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: zolitron-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://zolitron-frontend.onrender.com,http://localhost:5173

  - type: static
    name: zolitron-frontend
    buildCommand: "npm install && npm run install:client && npm --prefix client run build"
    staticPublishPath: client/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://zolitron-backend.onrender.com
      - key: VITE_MAPTILER_KEY
        value: ""
