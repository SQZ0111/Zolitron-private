databases:
  - name: zolitron-db
    databaseName: zolitron
    user: zolitron
    plan: free

services:
  - type: web
    name: zolitron-backend
    env: python
    plan: free
    autoDeployTrigger: checksPass
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: zolitron-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://zolitron-frontend.onrender.com,http://localhost:5173
      - key: ROBOFLOW_API_KEY
        sync: false
      - key: ROBOFLOW_WORKSPACE
        value: yoav1s-workspace
      - key: ROBOFLOW_WORKFLOW_ID
        value: trash-vtrash-t8mku-2-rfdetr-large-t1-logic-2
      - key: ROBOFLOW_API_URL
        value: https://serverless.roboflow.com
      - key: CAMERA_API_EMAIL
        sync: false
      - key: CAMERA_API_PASSWORD
        sync: false

  - type: static
    name: zolitron-frontend
    autoDeployTrigger: checksPass
    buildCommand: "npm install && npm run install:client && npm --prefix client run build"
    staticPublishPath: client/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://zolitron-backend.onrender.com
      - key: VITE_MAPTILER_KEY
        sync: false
