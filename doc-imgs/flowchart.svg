<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1900" viewBox="0 0 1500 1900" role="img" aria-labelledby="title desc">
  <title id="title">Zolitron current backend and marker flow</title>
  <desc id="desc">Swimlane flowchart showing current Zolitron MVP request flow from Vue frontend through FastAPI routers, CatalogService, repository, SQLite database, static image files, and map display.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#1f2937" />
    </marker>
    <style>
      .page { fill: #ffffff; }
      .title { font: 700 30px Arial, sans-serif; fill: #111827; }
      .subtitle { font: 400 16px Arial, sans-serif; fill: #4b5563; }
      .actor { fill: #ede9fe; stroke: #c4b5fd; stroke-width: 1.5; }
      .actor-text { font: 700 14px Arial, sans-serif; fill: #312e81; text-anchor: middle; }
      .lane { stroke: #d8b4fe; stroke-width: 1.2; }
      .section { fill: #fef3c7; stroke: #eab308; stroke-width: 1.4; }
      .section-text { font: 700 15px Arial, sans-serif; fill: #1f2937; text-anchor: middle; }
      .phase-blue { fill: #e0f2fe; opacity: .82; }
      .phase-green { fill: #dcfce7; opacity: .82; }
      .phase-orange { fill: #ffedd5; opacity: .82; }
      .phase-purple { fill: #ede9fe; opacity: .82; }
      .phase-red { fill: #fee2e2; opacity: .82; }
      .arrow { stroke: #1f2937; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .return { stroke: #4b5563; stroke-width: 1.6; stroke-dasharray: 5 4; fill: none; marker-end: url(#arrow); }
      .note { fill: #fffbeb; stroke: #f59e0b; stroke-width: 1.2; }
      .note-text { font: 400 13px Arial, sans-serif; fill: #374151; }
      .label { font: 400 13px Arial, sans-serif; fill: #111827; text-anchor: middle; }
      .small { font: 400 12px Arial, sans-serif; fill: #374151; text-anchor: middle; }
      .alt { fill: none; stroke: #a78bfa; stroke-width: 1.2; stroke-dasharray: 5 4; }
      .alt-label { fill: #ede9fe; stroke: #a78bfa; stroke-width: 1; }
      .alt-text { font: 700 12px Arial, sans-serif; fill: #4c1d95; }
    </style>
  </defs>

  <rect class="page" x="0" y="0" width="1500" height="1900" />
  <text class="title" x="70" y="52">Zolitron MVP Current Application Flow</text>
  <text class="subtitle" x="70" y="80">Sequence-style flowchart for the current REST API, normalized SQLite schema, dummy marker classifications, and popup images.</text>

  <!-- Actors -->
  <g id="actors-top">
    <rect class="actor" x="70" y="115" width="130" height="42" rx="4" />
    <text class="actor-text" x="135" y="141">User</text>

    <rect class="actor" x="245" y="115" width="150" height="42" rx="4" />
    <text class="actor-text" x="320" y="141">Vue Frontend</text>

    <rect class="actor" x="445" y="115" width="150" height="42" rx="4" />
    <text class="actor-text" x="520" y="141">FastAPI Router</text>

    <rect class="actor" x="650" y="115" width="150" height="42" rx="4" />
    <text class="actor-text" x="725" y="141">CatalogService</text>

    <rect class="actor" x="855" y="115" width="170" height="42" rx="4" />
    <text class="actor-text" x="940" y="141">CatalogRepository</text>

    <rect class="actor" x="1080" y="115" width="130" height="42" rx="4" />
    <text class="actor-text" x="1145" y="141">SQLite DB</text>

    <rect class="actor" x="1260" y="115" width="150" height="42" rx="4" />
    <text class="actor-text" x="1335" y="141">Static Images</text>
  </g>

  <!-- Lifelines -->
  <line class="lane" x1="135" y1="157" x2="135" y2="1785" />
  <line class="lane" x1="320" y1="157" x2="320" y2="1785" />
  <line class="lane" x1="520" y1="157" x2="520" y2="1785" />
  <line class="lane" x1="725" y1="157" x2="725" y2="1785" />
  <line class="lane" x1="940" y1="157" x2="940" y2="1785" />
  <line class="lane" x1="1145" y1="157" x2="1145" y2="1785" />
  <line class="lane" x1="1335" y1="157" x2="1335" y2="1785" />

  <!-- Phase 0 -->
  <rect class="phase-purple" x="60" y="185" width="1380" height="270" />
  <rect class="section" x="190" y="205" width="1120" height="28" />
  <text class="section-text" x="750" y="224">STEP 0: Backend startup and dummy data preparation</text>

  <line class="arrow" x1="520" y1="270" x2="725" y2="270" />
  <text class="label" x="622" y="258">lifespan starts application</text>

  <line class="arrow" x1="725" y1="315" x2="1145" y2="315" />
  <text class="label" x="935" y="303">init_db(): create normalized tables if missing</text>

  <line class="return" x1="1145" y1="360" x2="725" y2="360" />
  <text class="label" x="935" y="348">tables ready</text>

  <line class="arrow" x1="725" y1="405" x2="940" y2="405" />
  <text class="label" x="832" y="393">seed_dummy_data()</text>

  <line class="arrow" x1="940" y1="435" x2="1145" y2="435" />
  <text class="label" x="1042" y="423">merge categories, labels, images, classifications, analysis_run</text>

  <!-- Phase 1 -->
  <rect class="phase-blue" x="60" y="485" width="1380" height="300" />
  <rect class="section" x="190" y="505" width="1120" height="28" />
  <text class="section-text" x="750" y="524">STEP 1: Frontend requests marker-ready classification data</text>

  <line class="arrow" x1="135" y1="570" x2="320" y2="570" />
  <text class="label" x="228" y="558">opens map and submits city</text>

  <line class="arrow" x1="320" y1="620" x2="520" y2="620" />
  <text class="label" x="420" y="608">GET /api/classifications?city=Bochum</text>

  <line class="arrow" x1="520" y1="670" x2="725" y2="670" />
  <text class="label" x="622" y="658">router validates query params and calls service</text>

  <rect class="alt" x="500" y="700" width="860" height="60" />
  <rect class="alt-label" x="510" y="690" width="72" height="22" rx="8" />
  <text class="alt-text" x="525" y="705">optional</text>
  <text class="small" x="930" y="734">query filters: city and/or label</text>

  <!-- Phase 2 -->
  <rect class="phase-green" x="60" y="815" width="1380" height="340" />
  <rect class="section" x="190" y="835" width="1120" height="28" />
  <text class="section-text" x="750" y="854">STEP 2: Backend reads normalized data and shapes marker objects</text>

  <line class="arrow" x1="725" y1="910" x2="940" y2="910" />
  <text class="label" x="832" y="898">list_classifications(city, label)</text>

  <line class="arrow" x1="940" y1="960" x2="1145" y2="960" />
  <text class="label" x="1042" y="948">SELECT classifications JOIN images, labels, categories</text>

  <line class="return" x1="1145" y1="1010" x2="940" y2="1010" />
  <text class="label" x="1042" y="998">classification rows with relationships</text>

  <line class="return" x1="940" y1="1060" x2="725" y2="1060" />
  <text class="label" x="832" y="1048">SQLAlchemy model objects</text>

  <path class="arrow" d="M725 1105 C680 1105 680 1135 725 1135" />
  <text class="label" x="862" y="1125">build ClassificationRead: label, category, confidence, lat/lng, imgUrl</text>

  <!-- Phase 3 -->
  <rect class="phase-orange" x="60" y="1185" width="1380" height="265" />
  <rect class="section" x="190" y="1205" width="1120" height="28" />
  <text class="section-text" x="750" y="1224">STEP 3: API returns JSON and map renders markers</text>

  <line class="return" x1="725" y1="1280" x2="520" y2="1280" />
  <text class="label" x="622" y="1268">list[ClassificationRead]</text>

  <line class="return" x1="520" y1="1330" x2="320" y2="1330" />
  <text class="label" x="420" y="1318">200 JSON marker data</text>

  <path class="arrow" d="M320 1375 C260 1375 260 1410 320 1410" />
  <text class="label" x="465" y="1395">create markers; color by label</text>

  <rect class="note" x="740" y="1358" width="455" height="64" rx="4" />
  <text class="note-text" x="760" y="1382">Marker labels currently supported:</text>
  <text class="note-text" x="760" y="1404">overgrown, not-overgrown, garbage, not-garbage</text>

  <!-- Phase 4 -->
  <rect class="phase-red" x="60" y="1480" width="1380" height="230" />
  <rect class="section" x="190" y="1500" width="1120" height="28" />
  <text class="section-text" x="750" y="1519">STEP 4: Popup displays dummy image from imgUrl</text>

  <line class="arrow" x1="135" y1="1570" x2="320" y2="1570" />
  <text class="label" x="228" y="1558">clicks marker</text>

  <line class="arrow" x1="320" y1="1620" x2="1335" y2="1620" />
  <text class="label" x="827" y="1608">GET /static/dummy-images/overgrown-1.jpg</text>

  <line class="return" x1="1335" y1="1670" x2="320" y2="1670" />
  <text class="label" x="827" y="1658">image bytes</text>

  <path class="arrow" d="M320 1705 C260 1705 260 1740 320 1740" />
  <text class="label" x="470" y="1725">show popup with label, confidence, coordinates, image</text>

  <!-- Actors bottom -->
  <g id="actors-bottom">
    <rect class="actor" x="70" y="1810" width="130" height="42" rx="4" />
    <text class="actor-text" x="135" y="1836">User</text>

    <rect class="actor" x="245" y="1810" width="150" height="42" rx="4" />
    <text class="actor-text" x="320" y="1836">Vue Frontend</text>

    <rect class="actor" x="445" y="1810" width="150" height="42" rx="4" />
    <text class="actor-text" x="520" y="1836">FastAPI Router</text>

    <rect class="actor" x="650" y="1810" width="150" height="42" rx="4" />
    <text class="actor-text" x="725" y="1836">CatalogService</text>

    <rect class="actor" x="855" y="1810" width="170" height="42" rx="4" />
    <text class="actor-text" x="940" y="1836">CatalogRepository</text>

    <rect class="actor" x="1080" y="1810" width="130" height="42" rx="4" />
    <text class="actor-text" x="1145" y="1836">SQLite DB</text>

    <rect class="actor" x="1260" y="1810" width="150" height="42" rx="4" />
    <text class="actor-text" x="1335" y="1836">Static Images</text>
  </g>
</svg>