<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860" role="img" aria-labelledby="title desc">
  <title id="title">Zolitron current application flow</title>
  <desc id="desc">Current MVP flow from Vue client through FastAPI routers, service and repository layers, SQLite tables, and static image storage.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155" />
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .band { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .title { font: 700 30px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px Arial, sans-serif; fill: #475569; }
      .lane-title { font: 700 18px Arial, sans-serif; fill: #0f172a; }
      .box-title { font: 700 16px Arial, sans-serif; fill: #0f172a; }
      .box-text { font: 400 13px Arial, sans-serif; fill: #334155; }
      .small { font: 400 12px Arial, sans-serif; fill: #475569; }
      .client { fill: #e0f2fe; stroke: #0284c7; }
      .api { fill: #dcfce7; stroke: #16a34a; }
      .service { fill: #fef3c7; stroke: #d97706; }
      .data { fill: #ede9fe; stroke: #7c3aed; }
      .storage { fill: #fee2e2; stroke: #dc2626; }
      .future { fill: #f1f5f9; stroke: #64748b; stroke-dasharray: 6 5; }
      .arrow { stroke: #334155; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .muted-arrow { stroke: #64748b; stroke-width: 2; fill: none; stroke-dasharray: 6 5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1280" height="860" />
  <text class="title" x="60" y="55">Zolitron MVP Application Flow</text>
  <text class="subtitle" x="60" y="82">Current state: REST API with dummy marker data, normalized SQLite tables, and static popup images.</text>

  <rect class="band" x="40" y="115" width="1200" height="110" rx="8" />
  <text class="lane-title" x="60" y="145">Client Layer</text>
  <rect class="client" x="220" y="135" width="210" height="70" rx="8" />
  <text class="box-title" x="240" y="162">Vue Views</text>
  <text class="box-text" x="240" y="184">Map page, report pages</text>
  <rect class="client" x="520" y="135" width="230" height="70" rx="8" />
  <text class="box-title" x="540" y="162">Client Services</text>
  <text class="box-text" x="540" y="184">Fetch backend APIs</text>
  <rect class="client" x="840" y="135" width="260" height="70" rx="8" />
  <text class="box-title" x="860" y="162">Map UI</text>
  <text class="box-text" x="860" y="184">Markers and popups use imgUrl</text>

  <line class="arrow" x1="430" y1="170" x2="520" y2="170" />
  <line class="arrow" x1="750" y1="170" x2="840" y2="170" />

  <rect class="band" x="40" y="260" width="1200" height="170" rx="8" />
  <text class="lane-title" x="60" y="290">FastAPI Router Layer</text>
  <rect class="api" x="120" y="315" width="190" height="75" rx="8" />
  <text class="box-title" x="140" y="342">/api/images</text>
  <text class="box-text" x="140" y="364">Image metadata</text>
  <rect class="api" x="350" y="315" width="210" height="75" rx="8" />
  <text class="box-title" x="370" y="342">/api/classifications</text>
  <text class="box-text" x="370" y="364">Marker-ready results</text>
  <rect class="api" x="600" y="315" width="190" height="75" rx="8" />
  <text class="box-title" x="620" y="342">/api/labels</text>
  <text class="box-text" x="620" y="364">Labels and categories</text>
  <rect class="api" x="830" y="315" width="180" height="75" rx="8" />
  <text class="box-title" x="850" y="342">/api/stats</text>
  <text class="box-text" x="850" y="364">Counts and runs</text>
  <rect class="api" x="1040" y="315" width="150" height="75" rx="8" />
  <text class="box-title" x="1060" y="342">/api/map</text>
  <text class="box-text" x="1060" y="364">Legacy route</text>

  <line class="arrow" x1="635" y1="205" x2="455" y2="315" />
  <line class="arrow" x1="635" y1="205" x2="695" y2="315" />
  <line class="arrow" x1="635" y1="205" x2="920" y2="315" />

  <rect class="band" x="40" y="465" width="1200" height="130" rx="8" />
  <text class="lane-title" x="60" y="495">Backend Business Interface</text>
  <rect class="service" x="250" y="515" width="280" height="55" rx="8" />
  <text class="box-title" x="270" y="538">CatalogService</text>
  <text class="box-text" x="270" y="558">Backend interface used by routers</text>
  <rect class="service" x="690" y="515" width="310" height="55" rx="8" />
  <text class="box-title" x="710" y="538">Response Shaping</text>
  <text class="box-text" x="710" y="558">Builds marker objects with imgUrl</text>

  <line class="arrow" x1="455" y1="390" x2="390" y2="515" />
  <line class="arrow" x1="695" y1="390" x2="390" y2="515" />
  <line class="arrow" x1="920" y1="390" x2="845" y2="515" />
  <line class="arrow" x1="530" y1="542" x2="690" y2="542" />

  <rect class="band" x="40" y="630" width="1200" height="150" rx="8" />
  <text class="lane-title" x="60" y="660">Repository, Database, and File Storage</text>
  <rect class="data" x="95" y="690" width="230" height="55" rx="8" />
  <text class="box-title" x="115" y="713">CatalogRepository</text>
  <text class="box-text" x="115" y="733">SQLAlchemy queries and seeding</text>
  <rect class="data" x="390" y="675" width="340" height="85" rx="8" />
  <text class="box-title" x="410" y="700">SQLite: zolitron.db</text>
  <text class="box-text" x="410" y="722">images, classifications, labels,</text>
  <text class="box-text" x="410" y="742">categories, analysis_runs</text>
  <rect class="storage" x="800" y="675" width="320" height="85" rx="8" />
  <text class="box-title" x="820" y="700">Static Dummy Images</text>
  <text class="box-text" x="820" y="722">/static/dummy-images/*.jpg</text>
  <text class="box-text" x="820" y="742">Displayed in marker popups</text>

  <line class="arrow" x1="390" y1="570" x2="210" y2="690" />
  <line class="arrow" x1="325" y1="718" x2="390" y2="718" />
  <line class="arrow" x1="845" y1="570" x2="960" y2="675" />

  <rect class="future" x="875" y="475" width="275" height="75" rx="8" />
  <text class="box-title" x="895" y="502">Future AI Integration</text>
  <text class="box-text" x="895" y="524">TensorFlow predictions replace</text>
  <text class="box-text" x="895" y="544">current dummy classifications</text>
  <line class="muted-arrow" x1="875" y1="515" x2="530" y2="542" />

  <text class="small" x="60" y="820">Rule of thumb: frontend calls /api routes; routers call CatalogService; services call repositories; repositories query SQLite and image metadata.</text>
</svg>
